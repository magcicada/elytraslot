name: Build Elytra Slot Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge
        run: |
          set -o pipefail
          bash ./gradlew :forge:build --no-daemon --stacktrace 2>&1 | tee forge-build.log

      - name: Upload Forge jars
        uses: actions/upload-artifact@v4
        with:
          name: ElytraSlot-Forge-1.20.1
          path: forge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ElytraSlot-build-diagnostics
          path: |
            forge-build.log
            **/build/reports/problems/**
            **/build/test-results/test/*.xml
          if-no-files-found: warn
