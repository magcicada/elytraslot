name: Build elytraslot Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and reobfuscate
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload elytraslot jars
        uses: actions/upload-artifact@v4
        with:
          name: elytraslot
          path: build/libs/*.jar
          if-no-files-found: error
